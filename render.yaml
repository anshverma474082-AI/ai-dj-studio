databases:
  - name: ai-dj-studio-review-db
    databaseName: ai_dj_studio
    user: ai_dj_studio
    plan: free
    region: singapore

services:
  - type: web
    name: ai-dj-studio-review
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /healthz/db
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd backend && python -m scripts.synth_media && cd .. &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend
    startCommand: >-
      cd backend &&
      python -m alembic upgrade head &&
      python -m scripts.seed --if-empty &&
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-dj-studio-review-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
