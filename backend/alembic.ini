# Alembic configuration for AI DJ Studio.
#
# The database URL is intentionally NOT stored here — it would have to be
# committed, and it carries credentials (PRD §14.2). `migrations/env.py` reads it
# from app.config, which reads the environment / .env.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp + slug, so migrations sort chronologically across collaborators.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
